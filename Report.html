<script>
var allRows = [], filteredRows = [], sortCol = 'IncidentDate', sortAsc = false, semPts = 100;
var pointTiers = []; // admin-configured point-balance color tiers
var detailIdx = null;

window.addEventListener('load', function() {
  showLoading(true);
  google.script.run
    .withSuccessHandler(onDataLoaded)
    .withFailureHandler(function(err) {
      showLoading(false);
      document.getElementById('tbl-body').innerHTML =
        '<tr><td colspan="11" class="empty-msg" style="color:#dc2626;">Error: '+esc(err.message||err)+'</td></tr>';
    })
    .getReportData({});
});

function onDataLoaded(data) {
  showLoading(false);
  if (typeof updateNavUser === 'function') updateNavUser(data.user);
  allRows = data.rows || [];
  semPts  = data.semesterPoints || 100;
  pointTiers = data.pointTiers || [];

  var tchSel = document.getElementById('f-tch');
  (data.teacherOptions||[]).forEach(function(t) {
    tchSel.innerHTML += '<option value="'+esc(t)+'">'+esc(t)+'</option>';
  });
  var infSel = document.getElementById('f-inf');
  (data.infractionOptions||[]).forEach(function(t) {
    infSel.innerHTML += '<option value="'+esc(t)+'">'+esc(t)+'</option>';
  });

  filteredRows = allRows.slice();
  renderTable();
  updateSummary();
}

function applyFilters() {
  var stuName = document.getElementById('f-stu').value.trim().toLowerCase();
  var tch     = document.getElementById('f-tch').value.toLowerCase();
  var inf     = document.getElementById('f-inf').value;
  var sev     = document.getElementById('f-sev').value;
  var sta     = document.getElementById('f-sta').value;
  var from    = document.getElementById('f-from').value;
  var to      = document.getElementById('f-to').value;

  filteredRows = allRows.filter(function(row) {
    if (stuName && (row['StudentName']||'').toLowerCase().indexOf(stuName) < 0) return false;
    if (tch     && (row['TeacherName']||'').toLowerCase().indexOf(tch) < 0)     return false;
    if (inf     && row['InfractionType'] !== inf)                                return false;
    if (sev && sev !== 'All' && row['Severity'] !== sev)                         return false;
    if (sta && sta !== 'All' && row['Status']   !== sta)                         return false;
    if (from && row['IncidentDate'] < from)                                      return false;
    if (to   && row['IncidentDate'] > to)                                        return false;
    return true;
  });

  renderTable();
  updateSummary();
}

function clearFilters() {
  ['f-stu','f-from','f-to'].forEach(function(id){ document.getElementById(id).value=''; });
  ['f-tch','f-inf'].forEach(function(id){ document.getElementById(id).selectedIndex=0; });
  document.getElementById('f-sev').value = 'All';
  document.getElementById('f-sta').value = 'All';
  filteredRows = allRows.slice();
  renderTable();
  updateSummary();
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  var numCols = ['PointValue','CurrentPoints','ID','PointsBeforeReferral','PointsAfterReferral'];
  filteredRows.sort(function(a, b) {
    var av = a[col] !== undefined ? a[col] : '';
    var bv = b[col] !== undefined ? b[col] : '';
    if (numCols.indexOf(col) >= 0) { av = parseFloat(av)||0; bv = parseFloat(bv)||0; }
    else { av = av.toString().toLowerCase(); bv = bv.toString().toLowerCase(); }
    return av < bv ? (sortAsc?-1:1) : av > bv ? (sortAsc?1:-1) : 0;
  });
  renderTable();
}

function renderTable() {
  document.getElementById('res-count').textContent =
    filteredRows.length + ' referral' + (filteredRows.length!==1?'s':'') + ' shown';

  if (filteredRows.length === 0) {
    document.getElementById('tbl-body').innerHTML =
      '<tr><td colspan="11" class="empty-msg">No referrals match the filters.</td></tr>';
    return;
  }

  document.getElementById('tbl-body').innerHTML = filteredRows.map(function(row, idx) {
    var pts      = parseFloat(row['PointValue'])||0;
    var ptsStr   = pts > 0 ? '+'+pts : pts.toString();
    var ptsCls   = pts < 0 ? 'pts-neg' : pts > 0 ? 'pts-pos' : '';
    var balance  = parseInt(row['CurrentPoints'])||0;
    var bPct     = semPts > 0 ? Math.round(balance/semPts*100) : 0;
    var bColor   = row['CurrentPointsColor'] || getPointColor(bPct, pointTiers);
    var bBg      = hexToLightTint(bColor);
    var status   = (row['Status']||'Open').toString();
    var studentId = (row['StudentID']||'').toString();
    return '<tr'+(status==='Resolved'?' class="resolved"':'')+'>' +
      '<td style="color:#94a3b8;">'+esc(row['ID']||'')+'</td>' +
      '<td style="white-space:nowrap;">'+esc(formatDateMDY(row['IncidentDate']||''))+'</td>' +
      '<td><a class="stu-link" href="'+BASE_URL+'?page=student&id='+esc(studentId)+'">'+esc(row['StudentName']||'')+'</a></td>' +
      '<td>'+esc(row['Grade']||'')+'</td>' +
      '<td>'+esc(row['InfractionType']||'')+'</td>' +
      '<td class="'+ptsCls+'">'+ptsStr+'</td>' +
      '<td><span class="bal-pill" style="background:'+bBg+';color:'+bColor+';">'+balance+'</span></td>' +
      '<td>'+esc(row['TeacherName']||'')+'</td>' +
      '<td style="color:#64748b;white-space:nowrap;">'+esc(formatTime12h(row['IncidentTime']))+'</td>' +
      '<td><span class="badge badge-'+status.toLowerCase()+'">'+esc(status)+'</span></td>' +
      '<td><button class="btn btn-outline btn-sm" onclick="openDetail('+idx+')">View</button></td>' +
      '</tr>';
  }).join('');
}

function updateSummary() {
  var total = filteredRows.length;
  var open  = filteredRows.filter(function(r){ return r['Status'] !== 'Resolved'; }).length;
  var totalDed = filteredRows.reduce(function(s,r){ var p=parseFloat(r['PointValue'])||0; return s+(p<0?Math.abs(p):0); }, 0);
  setText('s-total', total);
  setText('s-open',  open);
  setText('s-res',   total - open);
  setText('s-pts',   total > 0 ? (totalDed/total).toFixed(1) : '0');
}

function openDetail(idx) {
  detailIdx = idx;
  var row   = filteredRows[idx];
  document.getElementById('d-title').textContent = 'Referral #'+(row['ID']||'')+' — '+(row['StudentName']||'');

  var pts    = parseFloat(row['PointValue'])||0;
  var ptsStr = pts > 0 ? '+'+pts : pts.toString();
  var ptsCls = pts < 0 ? 'color:#dc2626' : pts > 0 ? 'color:#166534' : '';

  var fields = [
    ['Student',     (row['StudentName']||'')+' (Grade '+(row['Grade']||'')+')'],
    ['Student ID',  row['StudentID']||''],
    ['Date / Time', formatDateMDY(row['IncidentDate']||'')+' at '+formatTime12h(row['IncidentTime']||'')],
    ['Submitted',   row['TimestampFormatted']||''],
    ['Location',    row['Location']||''],
    ['Infraction',  row['InfractionType']||''],
    ['Points',      '<span style="font-weight:700;'+ptsCls+'">'+ptsStr+' pts</span> &nbsp;('+
                    (row['PointsBeforeReferral']||0)+' → '+(row['PointsAfterReferral']||0)+')'],
    ['Balance',     '<strong>'+(row['CurrentPoints']||0)+' pts</strong>'],
    ['Teacher',     row['TeacherName']||''],
    ['Parent Notif.',row['ParentNotified']||''],
    ['Teacher Notif.',row['TeacherNotified']||'']
  ];

  var html = fields.map(function(f) {
    return '<div class="d-row"><div class="d-label">'+esc(f[0])+'</div>' +
           '<div class="d-val">'+f[1]+'</div></div>';
  }).join('');

  if (row['Description']) {
    var inEmail = (row['IncludeDescriptionInEmail']||'').toString().toLowerCase() === 'yes';
    html += '<hr class="d-hr"><div class="d-row"><div class="d-label">Description</div>' +
            '<div class="d-val">'+esc(row['Description'])+
            '<div style="margin-top:4px;font-size:0.74rem;color:'+(inEmail?'#166534':'#94a3b8')+';">' +
            (inEmail ? '✓ Included in parent email' : '✕ Not included in parent email') +
            '</div></div></div>';
  }

  html += '<hr class="d-hr">' +
    '<div style="margin-bottom:6px;font-weight:600;font-size:0.82rem;">Status</div>' +
    '<select id="d-status" style="width:100%;margin-bottom:10px;padding:7px;border:1px solid #d1d5db;border-radius:6px;">' +
    '<option value="Open"'+(row['Status']==='Open'?' selected':'')+'>Open</option>' +
    '<option value="Resolved"'+(row['Status']==='Resolved'?' selected':'')+'>Resolved</option>' +
    '</select>' +
    '<div style="margin-bottom:6px;font-weight:600;font-size:0.82rem;">Admin Notes</div>' +
    '<textarea class="d-notes" id="d-notes">'+esc(row['AdminNotes']||'')+'</textarea>' +
    '<button class="btn btn-primary" style="margin-top:10px;width:100%;" onclick="saveDetail()">Save Changes</button>' +
    '<div id="d-save-msg" style="margin-top:7px;font-size:0.8rem;min-height:18px;"></div>';

  document.getElementById('d-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  detailIdx = null;
}

function saveDetail() {
  if (detailIdx === null) return;
  var row    = filteredRows[detailIdx];
  var status = document.getElementById('d-status').value;
  var notes  = document.getElementById('d-notes').value;
  var msg    = document.getElementById('d-save-msg');
  msg.textContent = 'Saving...'; msg.style.color = '#1a56db';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        row['Status']     = status;
        row['AdminNotes'] = notes;
        msg.textContent = '✓ Saved'; msg.style.color = '#166534';
        renderTable(); updateSummary();
      } else {
        msg.textContent = 'Error: '+(result.error||'Unknown'); msg.style.color = '#dc2626';
      }
    })
    .withFailureHandler(function(err) {
      msg.textContent = 'Error: '+(err.message||err); msg.style.color = '#dc2626';
    })
    .updateReferralRow(row['ID'], status, notes);
}

function exportCsv() {
  if (filteredRows.length === 0) { alert('No data to export.'); return; }
  var cols = ['ID','IncidentDate','IncidentTime','StudentName','Grade','InfractionType',
              'PointValue','PointsBeforeReferral','PointsAfterReferral','CurrentPoints',
              'Location','Description','IncludeDescriptionInEmail','TeacherName',
              'ParentNotified','TeacherNotified','Status','AdminNotes'];
  var csv = cols.join(',') + '\n' + filteredRows.map(function(row) {
    return cols.map(function(c) {
      var v = row[c] !== undefined ? row[c].toString() : '';
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'referrals_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

function showLoading(on) {
  document.getElementById('loading-bar').style.display = on ? 'block' : 'none';
}
function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Converts a "HH:MM" (24-hr) string to "H:MM AM/PM" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
function formatTime12h(t) {
  if (!t) return '';
  var m = /^(\d{1,2}):(\d{2})/.exec(t);
  if (!m) return t;
  var h = parseInt(m[1], 10);
  var min = m[2];
  var period = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + min + ' ' + period;
}

// Converts a "YYYY-MM-DD" string to "MM-DD-YYYY" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
// Sorting (sortBy) and the Date From/To filters intentionally keep
// reading the raw YYYY-MM-DD value — only display text is reformatted.
function formatDateMDY(d) {
  if (!d) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if (!m) return d;
  return m[2] + '-' + m[3] + '-' + m[1];
}

// Mirrors POINT_COLOR_PALETTE in Code.gs — the constrained set of colors
// admins can choose from in Settings. Used only as a fallback below;
// each row from getReportData() already carries a resolved
// CurrentPointsColor hex value, so this path should rarely run.
var POINT_COLOR_PALETTE = {
  green: '#10b981', blue: '#3b82f6', purple: '#8b5cf6',
  amber: '#eab308', orange: '#f97316', red: '#ef4444'
};

// Resolves a percentage (0-100) to a hex color using the admin-configured
// point tiers. Mirrors getPointColor() in Code.gs. tiers must be sorted
// descending by threshold, which parsePointTiers() guarantees.
function getPointColor(pct, tiers) {
  var list = (tiers && tiers.length) ? tiers : [
    { threshold: 70, color: 'green' },
    { threshold: 40, color: 'amber' },
    { threshold: 0,  color: 'red'   }
  ];
  for (var i = 0; i < list.length; i++) {
    if (pct >= list[i].threshold) {
      return POINT_COLOR_PALETTE[list[i].color] || '#94a3b8';
    }
  }
  return '#94a3b8';
}

// Converts a hex color to a light background tint (mixed toward white)
// for use behind the balance pill. Works for any of the 6 palette colors
// without needing a separate server-side tint table.
function hexToLightTint(hex) {
  var h = (hex || '').replace('#', '');
  if (h.length !== 6) return '#f1f5f9';
  var r = parseInt(h.substr(0, 2), 16);
  var g = parseInt(h.substr(2, 2), 16);
  var b = parseInt(h.substr(4, 2), 16);
  var mix = function(c) { return Math.round(c + (255 - c) * 0.85); };
  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
}
