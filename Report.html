<script>
var allRows = [], filteredRows = [], sortCol = 'IncidentDate', sortAsc = false, semPts = 100;
var pointTiers = []; // admin-configured point-balance color tiers
var terms = []; // term start/end date ranges, for the Term filter
var reportStudents = []; // unique {studentId, studentName} pairs, derived from allRows
var selectedStudentId = ''; // set when a student is picked from the Student search dropdown
var PAGE_SIZE = 50;
var currentPage = 1;
var knownTotalCount = 0;
var reportLocations = [];
var detailIdx = null;
var isAdmin = false;

var TRASH_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/>' +
  '<path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>' +
  '<path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>';

// ── Toast notification ──────────────────────────────────────────
function showToast(message, isError, durationMs) {
  var wrap = document.getElementById('toast-wrap');
  var toast = document.createElement('div');
  toast.className = 'toast' + (isError ? ' toast-err' : '');
  toast.innerHTML = (isError
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
        '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' +
      '</svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
        '<path d="M20 6L9 17l-5-5"/>' +
      '</svg>') +
    '<span>' + esc(message) + '</span>';
  wrap.appendChild(toast);

  requestAnimationFrame(function() { toast.classList.add('show'); });

  setTimeout(function() {
    toast.classList.remove('show');
    setTimeout(function() { toast.remove(); }, 220);
  }, durationMs || 3200);
}

// A persistent toast for an operation that's in progress — doesn't
// auto-dismiss like showToast() does. The caller holds onto the
// returned element and calls dismissToast() on it once the real
// result (success or error) is ready to show its own toast.
function showLoadingToast(message) {
  var wrap = document.getElementById('toast-wrap');
  var toast = document.createElement('div');
  toast.className = 'toast toast-loading';
  toast.innerHTML = '<span class="toast-spinner"></span><span>' + esc(message) + '</span>';
  wrap.appendChild(toast);
  requestAnimationFrame(function() { toast.classList.add('show'); });
  return toast;
}

function dismissToast(toastEl) {
  if (!toastEl) return;
  toastEl.classList.remove('show');
  setTimeout(function() { toastEl.remove(); }, 220);
}

// ── Confirm popup (replaces native confirm() for destructive actions) ──
// Supports an optional required reason field (used for deleting a
// referral) — when opts.requireReason is set, the Delete button stays
// disabled until something is typed, and onConfirm receives the typed
// text as its argument.
var _confirmOnAccept  = null;
var _confirmReqReason = false;

function showConfirm(opts) {
  document.getElementById('confirm-title').textContent = opts.title || 'Are you sure?';
  document.getElementById('confirm-msg').textContent   = opts.message || '';
  document.getElementById('confirm-danger-btn').textContent = opts.confirmLabel || 'Delete';
  _confirmOnAccept  = opts.onConfirm || null;
  _confirmReqReason = !!opts.requireReason;

  var reasonWrap  = document.getElementById('confirm-reason-wrap');
  var reasonInput = document.getElementById('confirm-reason-input');
  var reasonLabel = document.getElementById('confirm-reason-label');
  var dangerBtn   = document.getElementById('confirm-danger-btn');

  if (_confirmReqReason) {
    reasonLabel.textContent = opts.reasonLabel || 'Reason';
    reasonInput.value = '';
    reasonInput.placeholder = opts.reasonPlaceholder || '';
    reasonWrap.style.display = 'block';
    dangerBtn.disabled = true;
  } else {
    reasonWrap.style.display = 'none';
    dangerBtn.disabled = false;
  }

  document.getElementById('confirm-overlay').classList.add('open');
}

// Enables/disables the Delete button as the reason field is typed into.
function _confirmReasonInput() {
  if (!_confirmReqReason) return;
  var val = document.getElementById('confirm-reason-input').value.trim();
  document.getElementById('confirm-danger-btn').disabled = !val;
}

function _confirmCancel() {
  document.getElementById('confirm-overlay').classList.remove('open');
  _confirmOnAccept = null;
}

function _confirmAccept() {
  var fn = _confirmOnAccept;
  var reasonVal = _confirmReqReason
    ? document.getElementById('confirm-reason-input').value.trim()
    : undefined;
  if (_confirmReqReason && !reasonVal) return; // guarded by disabled button too

  document.getElementById('confirm-overlay').classList.remove('open');
  _confirmOnAccept = null;
  if (fn) fn(reasonVal);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') _confirmCancel();
});

window.addEventListener('load', function() {
  showLoading(true);
  google.script.run
    .withSuccessHandler(onFirstPageLoaded)
    .withFailureHandler(function(err) {
      showLoading(false);
      document.getElementById('tbl-body').innerHTML =
        '<tr><td colspan="10" class="empty-msg" style="color:#dc2626;">Error: '+esc(err.message||err)+'</td></tr>';
    })
    .getReportDataPage(1, PAGE_SIZE);
});

// Phase 1: paint real data as fast as possible — just page 1, plus
// enough metadata (dropdown options, total count) to make the page
// look and behave normally. Filtering, sorting, export, and the
// summary cards all need the complete dataset to be accurate, so
// those stay disabled with a visible "loading everything" indicator
// until the background fetch in phase 2 finishes.
var fullDataLoaded = false;
var _bgLoadingToast = null;

function onFirstPageLoaded(data) {
  showLoading(false);
  if (typeof updateNavUser === 'function') updateNavUser(data.user);
  isAdmin = !!(data.user && data.user.role === 'admin');
  if (isAdmin) document.getElementById('btn-view-change-log').style.display = '';

  // Teacher filter is admin-only, per request — non-admin staff still
  // see every referral in the report, just without the ability to
  // filter the list down to one specific teacher's submissions.
  if (!isAdmin) {
    document.getElementById('f-tch-wrap').style.display = 'none';
    document.getElementById('filter-grid').style.gridTemplateColumns = 'repeat(3, 1fr)';
  }

  allRows    = data.rows || [];
  semPts     = data.termPoints || 100;
  pointTiers = data.pointTiers || [];
  terms      = data.terms || [];
  reportLocations = data.locations || [];

  var tchSel = document.getElementById('f-tch');
  (data.teacherOptions||[]).forEach(function(t) {
    tchSel.innerHTML += '<option value="'+esc(t)+'">'+esc(t)+'</option>';
  });
  var infSel = document.getElementById('f-inf');
  (data.infractionOptions||[]).forEach(function(t) {
    infSel.innerHTML += '<option value="'+esc(t)+'">'+esc(t)+'</option>';
  });
  var termSel = document.getElementById('f-term');
  terms.forEach(function(term, idx) {
    var endLabel = term.end === '9999-12-31' ? 'present' : formatDateMDY(term.end);
    termSel.innerHTML += '<option value="'+idx+'">'+esc(term.label)+
      ' ('+esc(formatDateMDY(term.start))+' – '+esc(endLabel)+')</option>';
  });

  // Page 1 only — reportStudents and filteredRows get rebuilt properly
  // once the full set arrives. This just gets something real on screen.
  filteredRows = allRows.slice();
  knownTotalCount = data.totalCount || allRows.length;
  renderTable();
  setControlsEnabled(false);
  _bgLoadingToast = showLoadingToast('Loading all ' + knownTotalCount + ' referrals\u2026');

  google.script.run
    .withSuccessHandler(onFullDataLoaded)
    .withFailureHandler(function(err) {
      dismissToast(_bgLoadingToast);
      showToast('Could not load full results: ' + (err.message || err), true);
    })
    .getReportData({});
}

// Phase 2: the complete dataset has arrived — replace the page-1-only
// data with everything, rebuild the student picker's full list, and
// turn filtering/sorting/export/summary stats back on.
function onFullDataLoaded(data) {
  allRows = data.rows || [];

  var seenStu = {};
  reportStudents = [];
  allRows.forEach(function(row) {
    var sid = (row['StudentID']||'').toString();
    if (sid && !seenStu[sid]) {
      seenStu[sid] = true;
      reportStudents.push({ studentId: sid, studentName: row['StudentName']||'' });
    }
  });
  reportStudents.sort(function(a, b) { return a.studentName.localeCompare(b.studentName); });

  filteredRows = allRows.slice();
  currentPage = 1;
  fullDataLoaded = true;
  renderTable();
  updateSummary();
  setControlsEnabled(true);
  dismissToast(_bgLoadingToast);
  showToast('All ' + allRows.length + ' referrals loaded.');
}

function setControlsEnabled(enabled) {
  document.querySelectorAll('#f-tch, #f-inf, #f-term, #f-from, #f-to, #f-stu, ' +
    '#btn-apply-filters, #btn-clear-filters, #btn-export-csv').forEach(function(el) {
    el.disabled = !enabled;
  });
  document.getElementById('sort-header-row').classList.toggle('sort-disabled', !enabled);
}

// Matches only at the start of a word, not anywhere within a word — so
// searching "a" finds "Aaron" or "Mary Ann Smith", not every name that
// happens to contain an "a" somewhere in the middle (e.g. "Frank").
function matchesWordStart(text, query) {
  if (!query) return true;
  var words = (text || '').toLowerCase().split(/\s+/);
  for (var i = 0; i < words.length; i++) {
    if (words[i].indexOf(query) === 0) return true;
  }
  return false;
}

// ── Student search dropdown (mirrors the referral form's student picker,
// adapted for single-select filtering rather than multi-select submission) ──
function searchReportStudents(query) {
  var q = (query || '').trim().toLowerCase();
  var results = document.getElementById('f-stu-results');

  // Typing anything (even matching the currently-selected student's own
  // name) clears the active filter until a result is clicked again —
  // same "must pick from the list" behavior as the referral form.
  if (selectedStudentId) {
    selectedStudentId = '';
    document.getElementById('f-stu-clear').style.display = 'none';
    applyFilters();
  }

  if (!q) { results.style.display = 'none'; return; }

  var hits = reportStudents.filter(function(s) {
    return matchesWordStart(s.studentName, q) ||
           (/\d/.test(q) && s.studentId.toLowerCase().indexOf(q) >= 0);
  }).slice(0, 40);

  if (hits.length === 0) {
    results.innerHTML = '<div style="padding:10px 12px;color:#9ca3af;font-size:0.82rem;">No students found.</div>';
    results.style.display = 'block';
    return;
  }

  results.innerHTML = hits.map(function(s) {
    return '<div class="rstu-item" onmousedown="selectReportStudent(\''+esc(s.studentId)+'\',\''+esc(s.studentName)+'\')">' +
      '<span class="rstu-name">'+esc(s.studentName)+'</span>' +
      '<span class="rstu-id">'+esc(s.studentId)+'</span>' +
    '</div>';
  }).join('');
  results.style.display = 'block';
}

function selectReportStudent(studentId, studentName) {
  selectedStudentId = studentId;
  document.getElementById('f-stu').value = studentName;
  document.getElementById('f-stu-clear').style.display = 'block';
  document.getElementById('f-stu-results').style.display = 'none';
  applyFilters();
}

function clearReportStudent() {
  selectedStudentId = '';
  document.getElementById('f-stu').value = '';
  document.getElementById('f-stu-clear').style.display = 'none';
  document.getElementById('f-stu-results').style.display = 'none';
  applyFilters();
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('#f-stu') && !e.target.closest('#f-stu-results')) {
    var r = document.getElementById('f-stu-results');
    if (r) r.style.display = 'none';
  }
});

function applyFilters() {
  if (!fullDataLoaded) { showToast('Still loading all referrals — one moment.', true); return; }
  var tch      = document.getElementById('f-tch').value.toLowerCase();
  var inf      = document.getElementById('f-inf').value;
  var termIdx  = document.getElementById('f-term').value;
  var term     = termIdx !== '' ? terms[parseInt(termIdx, 10)] : null;
  var from     = document.getElementById('f-from').value;
  var to       = document.getElementById('f-to').value;

  filteredRows = allRows.filter(function(row) {
    if (selectedStudentId && (row['StudentID']||'').toString() !== selectedStudentId) return false;
    if (tch     && (row['TeacherName']||'').toLowerCase().indexOf(tch) < 0)     return false;
    if (inf     && row['InfractionType'] !== inf)                                return false;
    if (term    && (row['IncidentDate'] < term.start || row['IncidentDate'] > term.end)) return false;
    if (from && row['IncidentDate'] < from)                                      return false;
    if (to   && row['IncidentDate'] > to)                                        return false;
    return true;
  });

  currentPage = 1;
  renderTable();
  updateSummary();
}

function clearFilters() {
  ['f-stu','f-from','f-to'].forEach(function(id){ document.getElementById(id).value=''; });
  ['f-tch','f-inf','f-term'].forEach(function(id){ document.getElementById(id).selectedIndex=0; });
  selectedStudentId = '';
  document.getElementById('f-stu-clear').style.display = 'none';
  document.getElementById('f-stu-results').style.display = 'none';
  filteredRows = allRows.slice();
  currentPage = 1;
  renderTable();
  updateSummary();
}

function sortBy(col) {
  if (!fullDataLoaded) return;
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  var numCols = ['PointValue','CurrentPoints','ID','PointsBeforeReferral','PointsAfterReferral'];
  filteredRows.sort(function(a, b) {
    var av = a[col] !== undefined ? a[col] : '';
    var bv = b[col] !== undefined ? b[col] : '';
    if (numCols.indexOf(col) >= 0) { av = parseFloat(av)||0; bv = parseFloat(bv)||0; }
    else { av = av.toString().toLowerCase(); bv = bv.toString().toLowerCase(); }
    return av < bv ? (sortAsc?-1:1) : av > bv ? (sortAsc?1:-1) : 0;
  });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  var effectiveTotal = fullDataLoaded ? filteredRows.length : Math.max(filteredRows.length, knownTotalCount);
  var totalPages = Math.max(1, Math.ceil(effectiveTotal / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  var startIdx = (currentPage - 1) * PAGE_SIZE;
  var endIdx   = Math.min(startIdx + PAGE_SIZE, filteredRows.length);
  var pageRows = filteredRows.slice(startIdx, endIdx);

  document.getElementById('res-count').textContent = effectiveTotal === 0
    ? '0 referrals shown'
    : 'Showing ' + (startIdx + 1) + '\u2013' + endIdx + ' of ' + effectiveTotal +
      ' referral' + (effectiveTotal !== 1 ? 's' : '') +
      (fullDataLoaded ? '' : ' (loading all\u2026)');

  if (filteredRows.length === 0) {
    document.getElementById('tbl-body').innerHTML =
      '<tr><td colspan="10" class="empty-msg">No referrals match the filters.</td></tr>';
    renderPagination(totalPages);
    return;
  }

  document.getElementById('tbl-body').innerHTML = pageRows.map(function(row, localIdx) {
    var idx      = startIdx + localIdx; // global index into filteredRows — openDetail() depends on this
    var pts      = parseFloat(row['PointValue'])||0;
    var ptsStr   = pts > 0 ? '+'+pts : pts.toString();
    var ptsCls   = pts < 0 ? 'pts-neg' : pts > 0 ? 'pts-pos' : '';
    var balance  = parseInt(row['CurrentPoints'])||0;
    var bPct     = semPts > 0 ? Math.round(balance/semPts*100) : 0;
    var bColor   = row['CurrentPointsColor'] || getPointColor(bPct, pointTiers);
    var bBg      = hexToLightTint(bColor);
    return '<tr>' +
      '<td style="color:#94a3b8;">'+esc(row['ID']||'')+'</td>' +
      '<td style="white-space:nowrap;">'+esc(formatDateMDY(row['IncidentDate']||''))+'</td>' +
      '<td>'+esc(row['StudentName']||'')+'</td>' +
      '<td>'+esc(row['Grade']||'')+'</td>' +
      '<td>'+esc(row['InfractionType']||'')+'</td>' +
      '<td class="'+ptsCls+'">'+ptsStr+'</td>' +
      '<td><span class="bal-pill" style="background:'+bBg+';color:'+bColor+';">'+balance+'</span></td>' +
      '<td>'+esc(row['TeacherName']||'')+'</td>' +
      '<td style="color:#64748b;white-space:nowrap;">'+esc(formatTime12h(row['IncidentTime']))+'</td>' +
      '<td><button class="btn btn-outline btn-sm" onclick="openDetail('+idx+')">View</button></td>' +
      '</tr>';
  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  var topEl = document.getElementById('pagination-top');
  var botEl = document.getElementById('pagination');

  if (totalPages <= 1) { topEl.innerHTML = ''; botEl.innerHTML = ''; return; }

  var lockedByLoad = !fullDataLoaded;

  function buildHtml(jumpInputId) {
    return '<button class="pg-btn" onclick="goToPage(1)" '+(lockedByLoad||currentPage<=1?'disabled':'')+'>\u00ab First</button>' +
      '<button class="pg-btn" onclick="goToPage(currentPage-1)" '+(lockedByLoad||currentPage<=1?'disabled':'')+'>\u2039 Prev</button>' +
      '<span class="pg-status">Page ' +
        '<input type="number" class="pg-jump" id="'+jumpInputId+'" value="'+currentPage+'" min="1" max="'+totalPages+'" '+(lockedByLoad?'disabled':'')+' ' +
               'onchange="goToPage(parseInt(this.value,10)||1)" onkeydown="if(event.key===\'Enter\')this.blur()">' +
        ' of ' + totalPages + (lockedByLoad ? ' <span style="color:#94a3b8;">(loading\u2026)</span>' : '') +
      '</span>' +
      '<button class="pg-btn" onclick="goToPage(currentPage+1)" '+(lockedByLoad||currentPage>=totalPages?'disabled':'')+'>Next \u203a</button>' +
      '<button class="pg-btn" onclick="goToPage('+totalPages+')" '+(lockedByLoad||currentPage>=totalPages?'disabled':'')+'>Last \u00bb</button>';
  }

  topEl.innerHTML = buildHtml('pg-jump-input-top');
  botEl.innerHTML = buildHtml('pg-jump-input-bottom');
}

function goToPage(n) {
  currentPage = n;
  renderTable();
  document.querySelector('.tbl-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateSummary() {
  var total = filteredRows.length;
  var neg = filteredRows.filter(function(r){ return (parseFloat(r['PointValue'])||0) < 0; }).length;
  var pos = filteredRows.filter(function(r){ return (parseFloat(r['PointValue'])||0) > 0; }).length;
  var totalDed = filteredRows.reduce(function(s,r){ var p=parseFloat(r['PointValue'])||0; return s+(p<0?Math.abs(p):0); }, 0);
  var uniqueStudents = new Set(filteredRows.map(function(r){ return r['StudentID']; })).size;
  setText('s-total', uniqueStudents);
  setText('s-neg',   neg);
  setText('s-pos',   pos);
  setText('s-pts',   total > 0 ? (totalDed/total).toFixed(1) : '0');
}

var _editInfractionsCache = null;

function openDetail(idx) {
  detailIdx = idx;
  var row = filteredRows[idx];
  document.getElementById('d-title').textContent = 'Referral #'+(row['ID']||'')+' — '+(row['StudentName']||'');
  renderDetailView(row);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function renderDetailView(row) {
  var pts    = parseFloat(row['PointValue'])||0;
  var ptsStr = pts > 0 ? '+'+pts : pts.toString();
  var ptsCls = pts < 0 ? 'color:#dc2626' : pts > 0 ? 'color:#166534' : '';

  var fields = [
    ['Student',     (row['StudentName']||'')+' (Grade '+(row['Grade']||'')+')'],
    ['Student ID',  row['StudentID']||''],
    ['Date / Time', formatDateMDY(row['IncidentDate']||'')+' at '+formatTime12h(row['IncidentTime']||'')],
    ['Submitted',   row['TimestampFormatted']||''],
    ['Location',    row['Location']||''],
    ['Infraction',  row['InfractionType']||''],
    ['Points',      '<span style="font-weight:700;'+ptsCls+'">'+ptsStr+' pts</span> &nbsp;('+
                    (row['PointsBeforeReferral']||0)+' → '+(row['PointsAfterReferral']||0)+')'],
    ['Balance',     '<strong>'+(row['CurrentPoints']||0)+' pts</strong>'],
    ['Teacher',     row['TeacherName']||''],
    ['Parent Notif.',row['ParentNotified']||''],
    ['Teacher Notif.',row['TeacherNotified']||'']
  ];

  var html = fields.map(function(f) {
    return '<div class="d-row"><div class="d-label">'+esc(f[0])+'</div>' +
           '<div class="d-val">'+f[1]+'</div></div>';
  }).join('');

  if (row['Description']) {
    var inEmail = (row['IncludeDescriptionInEmail']||'').toString().toLowerCase() === 'yes';
    html += '<hr class="d-hr"><div class="d-row"><div class="d-label">Description</div>' +
            '<div class="d-val">'+esc(row['Description'])+
            '<div style="margin-top:4px;font-size:0.74rem;color:'+(inEmail?'#166534':'#94a3b8')+';">' +
            (inEmail ? '✓ Included in parent email' : '✕ Not included in parent email') +
            '</div></div></div>';
  }

  if (isAdmin) {
    html += '<div style="margin-top:12px;">' +
      '<button class="btn btn-outline btn-sm" onclick="enterReferralEditMode()">Edit Referral Details</button>' +
      '</div>';
  }

  html += '<hr class="d-hr">' +
    '<div style="margin-bottom:6px;font-weight:600;font-size:0.82rem;">Admin Notes</div>' +
    '<textarea class="d-notes" id="d-notes">'+esc(row['AdminNotes']||'')+'</textarea>' +
    '<button class="btn btn-primary" style="margin-top:10px;width:100%;" onclick="saveDetail()">Save Changes</button>' +
    '<div id="d-save-msg" style="margin-top:7px;font-size:0.8rem;min-height:18px;"></div>';

  if (isAdmin) {
    html += '<hr class="d-hr">' +
      '<button class="btn-delete-referral" onclick="confirmDeleteReferral()">' + TRASH_SVG +
      '<span>Delete Referral</span></button>' +
      '<div style="margin-top:6px;font-size:0.74rem;color:#94a3b8;">' +
      'Permanently removes this referral, corrects the student\'s point balance, and records a ' +
      'reason in the change log.</div>';
  }

  document.getElementById('d-content').innerHTML = html;
}

// ── Edit Referral Details (admin only) ───────────────────────────
// Deliberately scoped to Date/Time/Location/Infraction/Description —
// the fields a teacher actually filled in on the original form. The
// student and teacher stay fixed; reassigning either is a different
// kind of correction (better handled by deleting and resubmitting, so
// the record of who actually submitted what stays honest).
function enterReferralEditMode() {
  if (_editInfractionsCache) { renderDetailEdit(); return; }
  document.getElementById('d-content').innerHTML = '<div class="empty-msg">Loading infraction list…</div>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r.success) {
        showToast(r.error || 'Could not load infraction list.', true);
        renderDetailView(filteredRows[detailIdx]);
        return;
      }
      _editInfractionsCache = r.rows || [];
      renderDetailEdit();
    })
    .withFailureHandler(function(err) {
      showToast(err.message || err, true);
      renderDetailView(filteredRows[detailIdx]);
    })
    .getInfractionsList();
}

function renderDetailEdit() {
  var row = filteredRows[detailIdx];

  var locOptions = reportLocations.map(function(l) {
    return '<option value="'+esc(l)+'"'+(l===row['Location']?' selected':'')+'>'+esc(l)+'</option>';
  }).join('');
  if (row['Location'] && reportLocations.indexOf(row['Location']) < 0) {
    locOptions += '<option value="'+esc(row['Location'])+'" selected>'+esc(row['Location'])+' (not in list)</option>';
  }

  var infOptions = _editInfractionsCache.map(function(inf) {
    var sign = inf.pointValue > 0 ? '+' : '';
    return '<option value="'+esc(inf.name)+'"'+(inf.name===row['InfractionType']?' selected':'')+'>'+
      esc(inf.name)+' ('+sign+inf.pointValue+' pts)</option>';
  }).join('');

  var html =
    '<div class="d-edit-row"><div class="d-label">Date</div>' +
      '<input type="date" class="d-edit-input" id="de-date" value="'+esc(row['IncidentDate']||'')+'"></div>' +
    '<div class="d-edit-row"><div class="d-label">Time</div>' +
      '<input type="time" class="d-edit-input" id="de-time" value="'+esc(row['IncidentTime']||'')+'"></div>' +
    '<div class="d-edit-row"><div class="d-label">Location</div>' +
      '<select class="d-edit-input" id="de-location">'+locOptions+'</select></div>' +
    '<div class="d-edit-row"><div class="d-label">Infraction</div>' +
      '<select class="d-edit-input" id="de-infraction">'+infOptions+'</select></div>' +
    '<div class="d-edit-row" style="align-items:flex-start;">' +
      '<div class="d-label" style="padding-top:6px;">Description</div>' +
      '<textarea class="d-edit-input" id="de-description" style="min-height:60px;resize:vertical;">'+
        esc(row['Description']||'')+'</textarea></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px;">' +
      '<button class="btn btn-outline" style="flex:1;" onclick="cancelReferralEdit()">Cancel</button>' +
      '<button class="btn btn-primary" style="flex:1;" onclick="saveReferralEdit()">Save Changes</button>' +
    '</div>' +
    '<div id="de-save-msg" style="margin-top:7px;font-size:0.8rem;min-height:18px;"></div>';

  document.getElementById('d-content').innerHTML = html;
}

function cancelReferralEdit() {
  renderDetailView(filteredRows[detailIdx]);
}

function saveReferralEdit() {
  var row = filteredRows[detailIdx];
  var updates = {
    incidentDate:   document.getElementById('de-date').value,
    incidentTime:   document.getElementById('de-time').value,
    location:       document.getElementById('de-location').value,
    infractionType: document.getElementById('de-infraction').value,
    description:    document.getElementById('de-description').value.trim()
  };
  var msgEl = document.getElementById('de-save-msg');
  if (!updates.incidentDate || !updates.incidentTime || !updates.location || !updates.infractionType) {
    msgEl.textContent = 'Date, time, location, and infraction are required.';
    msgEl.style.color = '#dc2626';
    return;
  }

  msgEl.textContent = 'Saving…';
  msgEl.style.color = '#1a56db';

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) {
        msgEl.textContent = result.error || 'Could not save changes.';
        msgEl.style.color = '#dc2626';
        return;
      }
      row['IncidentDate']        = updates.incidentDate;
      row['IncidentTime']        = updates.incidentTime;
      row['Location']            = updates.location;
      row['InfractionType']      = updates.infractionType;
      row['Description']         = updates.description;
      row['PointValue']          = result.newPointValue;
      row['PointsAfterReferral'] = result.newAfter;

      // CurrentPoints (the student's live balance) is shown on every
      // row belonging to them, not just this one — keep all of them
      // in sync rather than just the row that was actually edited.
      if (result.newBalance !== null && result.newBalance !== undefined) {
        allRows.forEach(function(r) {
          if (r['StudentID'] === row['StudentID']) r['CurrentPoints'] = result.newBalance;
        });
      }

      showToast('Referral updated.');
      renderDetailView(row);
      renderTable();
    })
    .withFailureHandler(function(err) {
      msgEl.textContent = err.message || err;
      msgEl.style.color = '#dc2626';
    })
    .updateReferralDetails(row['ID'], updates);
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  detailIdx = null;
}

// ── Change Log panel (admin only) ──────────────────────────────

function closeChangeLogPanel() {

}


function loadChangeLog() {
  var wrap = document.getElementById('change-log-content');
  wrap.innerHTML = '<div class="empty-msg">Loading...</div>';

    .withSuccessHandler(function(r) {

      }
      if (r.rows.length === 0) {
        wrap.innerHTML = '<div class="empty-msg">No referrals have been deleted or edited yet.</div>';

      }
      wrap.innerHTML = r.rows.map(function(row) {
        var pts    = row.pointValue || 0;
        var ptsStr = pts > 0 ? '+'+pts : pts.toString();
        var ptsCls = pts < 0 ? 'color:#dc2626' : 'color:#166534';
        var incident = formatDateMDY(row.incidentDate) +
          (row.incidentTime ? ' at ' + formatTime12h(row.incidentTime) : '');
        var isDeleted = row.action !== 'Edited';
        var badgeBg = isDeleted ? '#fee2e2' : '#dbeafe';
        var badgeFg = isDeleted ? '#991b1b' : '#1e40af';
        return '<div class="d-row" style="flex-direction:column;align-items:stretch;' +
               'border-bottom:1px solid #e5e7eb;padding-bottom:12px;margin-bottom:12px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;">' +
            '<span style="font-size:0.84rem;color:#1e293b;">' +
              '<span style="background:'+badgeBg+';color:'+badgeFg+';font-size:0.7rem;font-weight:700;' +
                'padding:2px 7px;border-radius:20px;margin-right:6px;text-transform:uppercase;">'+esc(row.action||'Deleted')+'</span>' +
              'by <strong>'+esc(row.changedByName)+'</strong></span>' +
            '<span style="font-size:0.76rem;color:#94a3b8;white-space:nowrap;">'+esc(row.timestamp)+'</span>' +
          '</div>' +
          '<div style="font-size:0.86rem;font-weight:600;">'+esc(row.studentName)+
            ' <span style="font-weight:400;color:#94a3b8;">('+esc(row.studentId)+')</span></div>' +
          '<div style="font-size:0.82rem;margin-top:2px;">'+esc(row.infractionType)+
            ' <span style="font-weight:700;'+ptsCls+'">'+ptsStr+' pts</span></div>' +
          '<div style="font-size:0.78rem;color:#94a3b8;margin-top:2px;">Incident: '+esc(incident)+'</div>' +
          '<div style="font-size:0.82rem;margin-top:8px;"><strong>Details:</strong> '+esc(row.details)+'</div>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function(err) {
      _changeLogLoaded = true;
      wrap.innerHTML = '<div class="empty-msg" style="color:#dc2626;">Couldn\'t load the change log: ' + esc(err.message || err) + '</div>';
    })
    .getChangeLog();
}

function saveDetail() {
  if (detailIdx === null) return;
  var row    = filteredRows[detailIdx];
  var notes  = document.getElementById('d-notes').value;
  var msg    = document.getElementById('d-save-msg');
  msg.textContent = 'Saving...'; msg.style.color = '#1a56db';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        row['AdminNotes'] = notes;
        msg.textContent = '✓ Saved'; msg.style.color = '#166534';
        renderTable(); updateSummary();
      } else {
        msg.textContent = 'Error: '+(result.error||'Unknown'); msg.style.color = '#dc2626';
      }
    })
    .withFailureHandler(function(err) {
      msg.textContent = 'Error: '+(err.message||err); msg.style.color = '#dc2626';
    })
    .updateReferralRow(row['ID'], notes);
}

function confirmDeleteReferral() {
  if (detailIdx === null) return;
  var row = filteredRows[detailIdx];

  showConfirm({
    title: 'Delete this referral?',
    message: 'Referral #' + row['ID'] + ' for ' + row['StudentName'] + ' (' + row['InfractionType'] +
              ') will be permanently removed, and their point balance will be recalculated to ' +
              'correctly reflect the change. This cannot be undone.',
    confirmLabel: 'Delete Referral',
    requireReason: true,
    reasonLabel: 'Reason for deletion (required)',
    reasonPlaceholder: 'e.g., wrong student entered, IEP protection...',
    onConfirm: function(reason) {
      var delBtn = document.querySelector('.btn-delete-referral');
      if (delBtn) {
        delBtn.disabled = true;
        delBtn.innerHTML = '<span>Deleting...</span>';
      }
      var loadingToast = showLoadingToast('Deleting referral...');

      google.script.run
        .withSuccessHandler(function(result) {
          dismissToast(loadingToast);
          if (!result.success) {
            showToast(result.error || 'Could not delete referral.', true);
            if (delBtn) { delBtn.disabled = false; delBtn.innerHTML = TRASH_SVG + '<span>Delete Referral</span>'; }
            return;
          }
          // Remove from both the full and filtered row sets, then close
          // the panel and refresh everything on screen.
          allRows      = allRows.filter(function(r)      { return r['ID'] !== row['ID']; });
          filteredRows = filteredRows.filter(function(r) { return r['ID'] !== row['ID']; });
          closeDetail();
          renderTable();
          updateSummary();

          showToast(result.recalculated
            ? 'Referral deleted. ' + result.studentName + '\u2019s balance is now ' + result.newBalance + ' pts.'
            : 'Referral deleted.');
        })
        .withFailureHandler(function(err) {
          dismissToast(loadingToast);
          showToast(err.message || err, true);
          if (delBtn) { delBtn.disabled = false; delBtn.innerHTML = TRASH_SVG + '<span>Delete Referral</span>'; }
        })
        .deleteReferral(row['ID'], reason);
    }
  });
}

function exportCsv() {
  if (!fullDataLoaded) { showToast('Still loading all referrals — one moment.', true); return; }
  if (filteredRows.length === 0) { showToast('No data to export.', true); return; }
  var cols = ['ID','IncidentDate','IncidentTime','StudentName','Grade','InfractionType',
              'PointValue','PointsBeforeReferral','PointsAfterReferral','CurrentPoints',
              'Location','Description','IncludeDescriptionInEmail','TeacherName',
              'ParentNotified','TeacherNotified','AdminNotes'];
  var csv = cols.join(',') + '\n' + filteredRows.map(function(row) {
    return cols.map(function(c) {
      var v = row[c] !== undefined ? row[c].toString() : '';
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'referrals_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

function showLoading(on) {
  document.getElementById('loading-bar').style.display = on ? 'block' : 'none';
}
function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Converts a "HH:MM" (24-hr) string to "H:MM AM/PM" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
function formatTime12h(t) {
  if (!t) return '';
  var m = /^(\d{1,2}):(\d{2})/.exec(t);
  if (!m) return t;
  var h = parseInt(m[1], 10);
  var min = m[2];
  var period = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + min + ' ' + period;
}

// Converts a "YYYY-MM-DD" string to "MM-DD-YYYY" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
// Sorting (sortBy) and the Date From/To filters intentionally keep
// reading the raw YYYY-MM-DD value — only display text is reformatted.
function formatDateMDY(d) {
  if (!d) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if (!m) return d;
  return m[2] + '-' + m[3] + '-' + m[1];
}

// Mirrors POINT_COLOR_PALETTE in Code.gs — the constrained set of colors
// admins can choose from in Settings. Used only as a fallback below;
// each row from getReportData() already carries a resolved
// CurrentPointsColor hex value, so this path should rarely run.
var POINT_COLOR_PALETTE = {
  green: '#10b981', blue: '#3b82f6', purple: '#8b5cf6',
  amber: '#eab308', orange: '#f97316', red: '#ef4444'
};

// Resolves a percentage (0-100) to a hex color using the admin-configured
// point tiers. Mirrors getPointColor() in Code.gs. tiers must be sorted
// descending by threshold, which parsePointTiers() guarantees.
function getPointColor(pct, tiers) {
  var list = (tiers && tiers.length) ? tiers : [
    { threshold: 70, color: 'green' },
    { threshold: 40, color: 'amber' },
    { threshold: 0,  color: 'red'   }
  ];
  for (var i = 0; i < list.length; i++) {
    if (pct >= list[i].threshold) {
      return POINT_COLOR_PALETTE[list[i].color] || '#94a3b8';
    }
  }
  return '#94a3b8';
}

// Converts a hex color to a light background tint (mixed toward white)
// for use behind the balance pill. Works for any of the 6 palette colors
// without needing a separate server-side tint table.
function hexToLightTint(hex) {
  var h = (hex || '').replace('#', '');
  if (h.length !== 6) return '#f1f5f9';
  var r = parseInt(h.substr(0, 2), 16);
  var g = parseInt(h.substr(2, 2), 16);
  var b = parseInt(h.substr(4, 2), 16);
  var mix = function(c) { return Math.round(c + (255 - c) * 0.85); };
  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
}
