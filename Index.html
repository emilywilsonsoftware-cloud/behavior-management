  </style>
</head>

<script>
// ── State ─────────────────────────────────────────────────────
var state = {
  teacherName: '', teacherEmail: '',
  allStudents: [],   // full roster loaded once
  selected:    [],   // selected student objects
  infMap:      {},   // name → { pointValue, severity }
  semPts:      100,
  nwLabel:     'Current Nine Weeks'
};

// ── Bootstrap — single server call ────────────────────────────
window.addEventListener('load', function() {
  var now = new Date();
  document.getElementById('inc-date').value = dateStr(now);
  document.getElementById('inc-time').value = pad(now.getHours()) + ':' + pad(now.getMinutes());

  google.script.run
    .withSuccessHandler(onBootstrap)
    .withFailureHandler(function(err) {
      document.getElementById('init-msg').textContent = 'Error loading form: ' + (err.message || err);
    })
    .getFormBootstrap();
});

function onBootstrap(data) {
  document.getElementById('init-msg').style.display = 'none';
  document.getElementById('form-body').style.display = '';

  if (typeof updateNavUser === 'function') updateNavUser(data.user);

  state.teacherName  = data.user.name  || data.user.email;
  state.teacherEmail = data.user.email;
  state.allStudents  = data.students   || [];
  state.semPts       = data.semesterPoints || 100;
  state.nwLabel      = data.currentNineWeeks ? data.currentNineWeeks.label : 'Current Nine Weeks';

  document.getElementById('teacher-name').value  = state.teacherName;
  document.getElementById('teacher-email').value = state.teacherEmail;

  // Populate form dropdowns
  fillSelect('loc-sel',   data.locations);
  fillSelect('motiv-sel', data.motivations);
  buildInfractionSelect(data.infractions);

  // Build redirections checkboxes
  document.getElementById('redir-grid').innerHTML = (data.redirections || []).map(function(r, i) {
    return '<div class="chk-item" onclick="document.getElementById(\'rd'+i+'\').click()">' +
      '<input type="checkbox" id="rd'+i+'" value="'+esc(r)+'" onclick="event.stopPropagation()">' +
      '<label for="rd'+i+'">'+esc(r)+'</label></div>';
  }).join('');

  // Build grade filter from actual student data
  var grades = [];
  state.allStudents.forEach(function(s) {
    if (s.grade && grades.indexOf(s.grade) < 0) grades.push(s.grade);
  });
  grades.sort(function(a, b) {
    return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || a.localeCompare(b);
  });
  var gradeSel = document.getElementById('filter-grade');
  grades.forEach(function(g) {
    gradeSel.innerHTML += '<option value="'+esc(g)+'">Grade '+esc(g)+'</option>';
  });
  document.getElementById('filter-count').textContent = state.allStudents.length + ' students';
}

// ── Student Search (client-side — no round trip) ──────────────
function searchStudents(query) {
  var q        = (query || '').trim().toLowerCase();
  var gradeVal = document.getElementById('filter-grade').value;
  var hasFilter = q || gradeVal;
  var container = document.getElementById('student-results');

  if (!hasFilter) {
    container.style.display = 'none';
    document.getElementById('filter-count').textContent =
      state.allStudents.length + ' students';
    return;
  }

  var hits = state.allStudents.filter(function(s) {
    if (gradeVal && s.grade !== gradeVal) return false;
    if (q && s.studentName.toLowerCase().indexOf(q) < 0 &&
             s.studentId.toLowerCase().indexOf(q)   < 0) return false;
    return true;
  }).slice(0, 40);

  document.getElementById('filter-count').textContent =
    hits.length + ' of ' + state.allStudents.length + ' students';

  if (hits.length === 0) {
    container.innerHTML = '<div style="padding:12px 14px;color:#9ca3af;font-size:0.85rem;">No students match these filters.</div>';
    container.style.display = 'block';
    return;
  }

  container.innerHTML = hits.map(function(s) {
    var isSelected = state.selected.some(function(x) { return x.studentId === s.studentId; });
    var pct = state.semPts > 0 ? Math.round(s.currentPoints / state.semPts * 100) : 0;
    var ptsCls = pct >= 70 ? 'pts-hi' : pct >= 40 ? 'pts-md' : 'pts-lo';
    return '<div class="stu-result-item" onclick="toggleStudent(\''+esc(s.studentId)+'\')">' +
      '<input type="checkbox" id="chk_'+esc(s.studentId)+'" ' + (isSelected ? 'checked' : '') +
             ' onclick="event.stopPropagation();toggleStudent(\''+esc(s.studentId)+'\')">' +
      '<span class="stu-result-name">'+esc(s.studentName)+'</span>' +
      '<div class="stu-result-meta">' +
        '<span class="stu-result-sub">Gr '+esc(s.grade)+' · '+esc(s.studentId)+'</span>' +
        '<span class="stu-result-pts '+ptsCls+'">'+s.currentPoints+' pts</span>' +
      '</div>' +
      '</div>';
  }).join('');
  container.style.display = 'block';
}

function clearSearch() {
  document.getElementById('student-search').value = '';
  document.getElementById('filter-grade').value   = '';
  document.getElementById('student-results').style.display = 'none';
  document.getElementById('filter-count').textContent =
    state.allStudents.length + ' students';
}

function toggleStudent(studentId) {
  var student = state.allStudents.find(function(s) { return s.studentId === studentId; });
  if (!student) return;

  var idx = state.selected.findIndex(function(s) { return s.studentId === studentId; });
  if (idx > -1) state.selected.splice(idx, 1);
  else           state.selected.push(student);

  var chk = document.getElementById('chk_' + studentId);
  if (chk) chk.checked = (idx === -1);

  updateSelectedStrip();
  updateSubmitButton();
  maybeLoadNineWeeks();
}

function updateSelectedStrip() {
  document.getElementById('selected-strip').innerHTML = state.selected.map(function(s) {
    return '<div class="sel-badge">'+esc(s.studentName)+
           '<span class="rm" onclick="toggleStudent(\''+esc(s.studentId)+'\')">×</span></div>';
  }).join('');
}

function updateSubmitButton() {
  var n   = state.selected.length;
  var btn = document.getElementById('submit-btn');
  document.getElementById('sel-count').textContent =
    n ? n + ' student'+(n>1?'s':'')+' selected' : 'No students selected';
  btn.disabled    = n === 0;
  btn.textContent = n ? 'Submit '+n+' Referral'+(n>1?'s':'') : 'Submit Referral(s)';
}

// ── Nine-Weeks Panel ──────────────────────────────────────────
// Show when exactly one student is selected; fetch from server.
var _nwCache = {};  // studentId → data (avoid re-fetching)

function maybeLoadNineWeeks() {
  var panel = document.getElementById('nw-panel');
  if (state.selected.length !== 1) { panel.style.display = 'none'; return; }

  var sid = state.selected[0].studentId;
  panel.style.display = 'block';
  document.getElementById('nw-title').textContent =
    state.nwLabel + ' Referrals — ' + state.selected[0].studentName;

  if (_nwCache[sid]) { renderNwPanel(_nwCache[sid]); return; }

  document.getElementById('nw-body').innerHTML = '<div class="nw-empty">Loading...</div>';

  google.script.run
    .withSuccessHandler(function(data) {
      _nwCache[sid] = data;
      if (state.selected.length === 1 && state.selected[0].studentId === sid)
        renderNwPanel(data);
    })
    .withFailureHandler(function(err) {
      document.getElementById('nw-body').innerHTML =
        '<div class="nw-empty" style="color:#dc2626;">Error: '+(err.message||err)+'</div>';
    })
    .getStudentFormCard(sid);
}

function renderNwPanel(data) {
  var body = document.getElementById('nw-body');
  if (data.error) { body.innerHTML = '<div class="nw-empty" style="color:#dc2626;">'+esc(data.error)+'</div>'; return; }

  var refs = data.nwRefs || [];
  if (refs.length === 0) {
    body.innerHTML = '<div class="nw-empty">No referrals this nine weeks. ✓</div>';
    return;
  }

  var html = '<table class="nw-table"><thead><tr>' +
    '<th>Date</th><th>Infraction</th><th>Severity</th><th>Pts Δ</th><th>Teacher</th>' +
    '</tr></thead><tbody>';
  refs.forEach(function(r) {
    var pts    = parseInt(r.pointValue, 10) || 0;
    var ptsStr = pts > 0 ? '+'+pts : pts.toString();
    var ptsCls = pts < 0 ? 'color:#dc2626' : pts > 0 ? 'color:#166534' : 'color:#6b7280';
    var sev    = (r.severity||'').toString();
    html += '<tr>' +
      '<td style="white-space:nowrap;">'+esc(r.incidentDate)+'</td>' +
      '<td>'+esc(r.infractionType)+'</td>' +
      '<td><span class="badge badge-'+sev.toLowerCase()+'">'+esc(sev)+'</span></td>' +
      '<td style="font-weight:700;'+ptsCls+'">'+ptsStr+'</td>' +
      '<td style="font-size:0.78rem;color:#6b7280;">'+esc(r.teacherName)+'</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}

// ── Infraction dropdown ────────────────────────────────────────
function buildInfractionSelect(infractions) {
  state.infMap = {};
  var sel    = document.getElementById('inf-sel');
  var groups = { Positive: [], Minor: [], Major: [], Other: [] };
  infractions.forEach(function(inf) {
    state.infMap[inf.name] = inf;
    var g = groups[inf.severity] ? inf.severity : 'Other';
    groups[g].push(inf);
  });
  sel.innerHTML = '<option value="">— Select —</option>';
  ['Positive','Minor','Major','Other'].forEach(function(g) {
    var items = groups[g];
    if (!items || items.length === 0) return;
    var og = document.createElement('optgroup');
    og.label = g + ' Behaviors';
    items.forEach(function(inf) {
      var opt = document.createElement('option');
      opt.value       = inf.name;
      opt.dataset.pts = inf.pointValue;
      opt.dataset.sev = inf.severity;
      var sign = inf.pointValue > 0 ? '+' : '';
      opt.textContent = inf.name + '  (' + sign + inf.pointValue + ' pts)';
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}

function onInfractionChange() {
  var sel = document.getElementById('inf-sel');
  var opt = sel.options[sel.selectedIndex];
  var preview = document.getElementById('point-preview');
  if (!opt || !opt.dataset.pts) { preview.innerHTML = ''; return; }
  var pts  = parseInt(opt.dataset.pts, 10);
  var sign = pts > 0 ? '+' : '';
  var cls  = pts < 0 ? 'pt-neg' : pts > 0 ? 'pt-pos' : 'pt-zer';
  var verb = pts < 0 ? 'deducted per student' : pts > 0 ? 'added per student' : 'no point change';
  preview.innerHTML = '<span class="pt-badge '+cls+'">'+sign+pts+' pts</span>' +
                      '<span style="color:#6b7280;font-weight:400;">'+verb+'</span>';
}

// ── Submit ────────────────────────────────────────────────────
function submitForm() {
  clearStatus();
  if (!state.selected.length) { showErr('Select at least one student.'); return; }
  var date = document.getElementById('inc-date').value;
  var time = document.getElementById('inc-time').value;
  var loc  = document.getElementById('loc-sel').value;
  var inf  = document.getElementById('inf-sel').value;
  if (!date) { showErr('Please enter the incident date.'); return; }
  if (!time) { showErr('Please enter the incident time.'); return; }
  if (!loc)  { showErr('Please select a location.'); return; }
  if (!inf)  { showErr('Please select an infraction type.'); return; }

  var infOpt  = document.getElementById('inf-sel');
  var selOpt  = infOpt.options[infOpt.selectedIndex];
  var severity = selOpt ? (selOpt.dataset.sev || '') : '';

  var checked  = document.querySelectorAll('#redir-grid input:checked');
  var redirs   = Array.from(checked).map(function(c) { return c.value; }).join('; ');
  var motiv    = document.getElementById('motiv-sel').value;
  var desc     = document.getElementById('description').value.trim();

  var referrals = state.selected.map(function(s) {
    return { studentId: s.studentId, studentName: s.studentName, grade: s.grade,
             incidentDate: date, incidentTime: time, location: loc,
             infractionType: inf, severity: severity, redirections: redirs,
             possibleMotivation: motiv, description: desc,
             teacherName: state.teacherName, teacherEmail: state.teacherEmail,
             className: '' };
  });

  document.getElementById('submit-btn').disabled = true;
  showLoad('Submitting ' + referrals.length + ' referral' + (referrals.length > 1 ? 's' : '') + '...');

  google.script.run
    .withSuccessHandler(onSubmitOk)
    .withFailureHandler(function(err) {
      showErr('Submission failed: ' + (err.message || err));
      document.getElementById('submit-btn').disabled = false;
    })
    .submitReferrals(referrals);
}

function onSubmitOk(result) {
  document.getElementById('submit-btn').disabled = false;
  if (result.errors && result.errors.length) {
    showErr('Saved ' + result.saved + ' referral(s) with errors:\n' + result.errors.join('\n'));
  } else {
    showOk('✓ ' + result.saved + ' referral' + (result.saved > 1 ? 's' : '') +
           ' submitted. You will receive a confirmation email shortly.');
    resetForm();
  }
}

function resetForm() {
  state.selected = [];
  _nwCache = {};
  updateSelectedStrip();
  updateSubmitButton();
  clearSearch();
  document.getElementById('nw-panel').style.display = 'none';
  var now = new Date();
  document.getElementById('inc-date').value = dateStr(now);
  document.getElementById('inc-time').value = pad(now.getHours())+':'+pad(now.getMinutes());
  document.getElementById('loc-sel').value   = '';
  document.getElementById('inf-sel').value   = '';
  document.getElementById('motiv-sel').value = '';
  document.getElementById('description').value = '';
  document.getElementById('point-preview').innerHTML = '';
  document.querySelectorAll('#redir-grid input:checked').forEach(function(c){ c.checked=false; });
}

// ── Utilities ─────────────────────────────────────────────────
function fillSelect(id, options) {
  var sel = document.getElementById(id);
  sel.innerHTML = '<option value="">— Select —</option>';
  (options||[]).forEach(function(o) {
    var opt = document.createElement('option');
    opt.value = opt.textContent = o;
    sel.appendChild(opt);
  });
}

function showOk(m)   { setStatus(m,'s-ok');  }
function showErr(m)  { setStatus(m,'s-err'); }
function showLoad(m) { setStatus(m,'s-ld');  }
function setStatus(m, cls) {
  var el = document.getElementById('status-msg');
  el.textContent = m; el.className = cls;
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function clearStatus() {
  var el = document.getElementById('status-msg');
  el.textContent=''; el.style.display='none'; el.className='';
}
function dateStr(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n) { return n < 10 ? '0'+n : ''+n; }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
