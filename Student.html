<script>

// Read server-side via doGet()'s e.parameter.id rather than

</script>

<script>
var allStudents   = [];
var semPts        = 100;
var pointTiers    = []; // admin-configured point-balance color tiers
var currentStudent = null;
var activeTermIdx   = -1; // index into term array; -1 = all
var _refDetailLookup = {}; // referral ID → full referral object, for the View Details modal

// ── Load all students once ────────────────────────────────────
window.addEventListener('load', function() {
  // Read from URL_ID (injected server-side by doGet() via templating)
  // rather than parsing window.location.search on the client — see the
  // comment on URL_ID above for why.
  var urlId = URL_ID;

  google.script.run
    .withSuccessHandler(function(data) {
      if (typeof updateNavUser === 'function') updateNavUser(data.user);
      allStudents = data.students || [];
      semPts      = data.semesterPoints || 100;
      pointTiers  = data.pointTiers || [];

      // Build grade filter from actual student data
      var grades = [];
      allStudents.forEach(function(s) {
        if (s.grade && grades.indexOf(s.grade) < 0) grades.push(s.grade);
      });
      grades.sort(function(a, b) {
        return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || a.localeCompare(b);
      });
      var gradeSel = document.getElementById('filter-grade');
      grades.forEach(function(g) {
        gradeSel.innerHTML += '<option value="'+esc(g)+'">Grade '+esc(g)+'</option>';
      });
      document.getElementById('filter-count').textContent = allStudents.length + ' students';

      if (urlId) {
        loadProfile(urlId);
      } else {
        document.getElementById('search-results').innerHTML =
          '<div class="empty-msg">Start typing a name, or filter by grade.</div>';
        document.getElementById('search-results').style.display = 'block';
        document.getElementById('stu-search').focus();
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('search-panel').innerHTML =
        '<div style="color:#dc2626;padding:16px;">Error: '+(err.message||err)+'</div>';
    })
    .getAllStudents();
});

// ── Search (client-side — instant) ───────────────────────────
// Matches only at the start of a word, not anywhere within a word — so
// searching "a" finds "Aaron" or "Mary Ann Smith", not every name that
// happens to contain an "a" somewhere in the middle (e.g. "Frank").
function matchesWordStart(text, query) {
  if (!query) return true;
  var words = (text || '').toLowerCase().split(/\s+/);
  for (var i = 0; i < words.length; i++) {
    if (words[i].indexOf(query) === 0) return true;
  }
  return false;
}

function onSearch(query) {
  var q        = (query || '').trim().toLowerCase();
  var gradeVal = document.getElementById('filter-grade').value;
  var results  = document.getElementById('search-results');
  results.style.display = 'block';

  var hasFilter = q || gradeVal;
  if (!hasFilter) {
    results.innerHTML = '<div class="empty-msg">Start typing a name, or filter by grade.</div>';
    document.getElementById('filter-count').textContent = allStudents.length + ' students';
    return;
  }

  var hits = allStudents.filter(function(s) {
    if (gradeVal && s.grade !== gradeVal) return false;
    if (q && !matchesWordStart(s.studentName, q) &&
             !(/\d/.test(q) && s.studentId.toLowerCase().indexOf(q) >= 0)) return false;
    return true;
  }).slice(0, 40);

  document.getElementById('filter-count').textContent =
    hits.length + ' of ' + allStudents.length + ' students';

  if (hits.length === 0) {
    results.innerHTML = '<div class="empty-msg">No students match these filters.</div>';
    return;
  }

  results.innerHTML = hits.map(function(s) {
    var pct      = semPts > 0 ? Math.round(s.currentPoints / semPts * 100) : 0;
    var ptsColor = s.pointColor || getPointColor(pct, pointTiers);
    var init     = initials(s.studentName);
    var bg       = avatarColor(s.studentId);
    return '<div class="stu-row" onclick="loadProfile(\''+esc(s.studentId)+'\')">' +
      '<div class="stu-avatar" style="background:'+bg+';">'+esc(init)+'</div>' +
      '<div class="stu-info">' +
        '<div class="stu-name">'+esc(s.studentName)+'</div>' +
        '<div class="stu-sub">Grade '+esc(s.grade)+' · ID: '+esc(s.studentId)+'</div>' +
      '</div>' +
      '<div class="stu-pts">' +
        '<div class="pts-val" style="color:'+ptsColor+';">'+s.currentPoints+'</div>' +
        '<div class="pts-pct">'+pct+'% of '+semPts+'</div>' +
      '</div></div>';
  }).join('');
}

function clearSearch() {
  document.getElementById('stu-search').value   = '';
  document.getElementById('filter-grade').value = '';
  document.getElementById('search-results').innerHTML =
    '<div class="empty-msg">Start typing a name, or filter by grade.</div>';
  document.getElementById('filter-count').textContent = allStudents.length + ' students';
}

function loadProfile(studentId) {

// ── Render Profile ────────────────────────────────────────────
function renderProfile(data) {
  if (data.error) {
    document.getElementById('profile-content').innerHTML =
      '<div style="color:#dc2626;padding:20px;">'+esc(data.error)+'</div>';
    return;
  }

  currentStudent = data;
  var s      = data.student;
  var sp     = data.semesterPoints;
  var isAdm  = data.user && data.user.role === 'admin';
  var pct    = sp > 0 ? Math.max(0,Math.min(100,Math.round(s.currentPoints/sp*100))) : 0;
  var ptColor = s.pointColor || getPointColor(pct, data.pointTiers);
  var ptBg    = hexToLightTint(ptColor);
  var init    = initials(s.studentName);
  var bg      = avatarColor(s.studentId);
  var sum     = data.summary;

  var html = '';

  // Profile header
  html +=
    '<div class="profile-hdr">' +
      '<div class="p-avatar" style="background:'+bg+';">'+esc(init)+'</div>' +
      '<div class="p-info">' +
        '<div class="p-name">'+esc(s.studentName)+'</div>' +
        '<div class="p-meta">Grade '+esc(s.grade)+' · ID: '+esc(s.studentId)+'</div>' +
        '<div class="p-contact">' +
          '<span style="color:#94a3b8;">' +
            (s.contactCount > 0
              ? s.contactCount + ' referral email contact' + (s.contactCount > 1 ? 's' : '') + ' on file'
              : 'No referral email contacts on file') +
          '</span>' +
        '</div>' +
        (isAdm ? '<button class="edit-info-btn" onclick="openEditInfoModal()">Edit Info</button>' : '') +
      '</div>' +
      '<div class="pts-display" style="border-color:'+ptColor+';background:'+ptBg+';">' +
        '<div class="pts-big" style="color:'+ptColor+';">'+s.currentPoints+'</div>' +
        '<div class="pts-lbl">Current Points</div>' +
        '<div class="pts-bar-o"><div class="pts-bar-i" style="width:'+pct+'%;background:'+ptColor+';"></div></div>' +
        '<div class="pts-pct2">'+pct+'% of '+sp+'</div>' +
      '</div>' +
    '</div>';

  // Summary badges
  html +=
    '<div class="sum-badges">' +
      badge2(sum.negative, 'Negative', 'maj')  +
      badge2(sum.positive, 'Positive', 'pos')  +
    '</div>';

  // Term summary mini-cards
  if (data.termSummary && data.termSummary.length > 0) {
    var curTerm = data.currentTerm;
    html += '<div class="term-summary" style="margin-bottom:16px;">';
    data.termSummary.forEach(function(term) {
      var isCur = curTerm && term.start === curTerm.start;
      html += '<div class="term-mini'+(isCur?' current':'')+'"><div class="term-mini-v">'+term.count+'</div>' +
              '<div class="term-mini-l">'+esc(term.label)+(isCur?' ★':'')+'</div></div>';
    });
    html += '</div>';
  }

  // Filter tabs — Term periods
  // in the same row.
  var tabs = '<div class="term-tabs">' +
    '<div class="term-tab active" id="tab-all" onclick="filterByTerm(-1)">All Referrals</div>';
  if (data.terms) {
    data.terms.forEach(function(term, idx) {
      var isCur = data.currentTerm && term.start === data.currentTerm.start;
      tabs += '<div class="term-tab" id="tab-'+idx+'" onclick="filterByTerm('+idx+')">' +
              esc(term.label) + (isCur ? ' ★' : '') + '</div>';
    });
  }
  tabs += '</div>';

  // Two-column layout
  html += '<div class="two-col">';

  // Referral history / Contacts panel (swapped via JS, same tab row)
  html += '<div>' + tabs +
    '<div class="card" style="border-radius:0 10px 10px 10px;">' +
    '<div class="card-bdy" style="padding:0;overflow-x:auto;" id="left-panel-wrap">' +
    '<div id="ref-table-wrap">' + buildRefTable(data.referrals, -1, data.terms) + '</div>' +
    '</div></div></div>';

  // Right column: timeline + breakdown
  html += '<div>' +
    '<div class="card" style="margin-bottom:14px;">' +
    '<div class="card-hdr">Point Balance Timeline</div>' +
    '<div class="card-bdy">' +
    (data.pointTimeline.length === 0
      ? '<div style="color:#94a3b8;padding:16px;text-align:center;">No referrals yet.</div>'
      : buildTimelineSVG(data.pointTimeline, sp, data.pointTiers)) +
    '</div></div>' +

    '<div class="card">' +
    '<div class="card-hdr">Infraction Breakdown</div>' +
    '<div class="card-bdy">' +
    (data.infractionBreakdown.length === 0
      ? '<div style="color:#94a3b8;padding:8px;">No infractions yet.</div>'
      : (function() {
          var max = data.infractionBreakdown[0].count || 1;
          return data.infractionBreakdown.map(function(item) {
            var pct2 = Math.round(item.count / max * 100);
            return '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:3px;">' +
              '<span style="color:#374151;font-weight:500;">'+esc(item.name)+'</span>' +
              '<span style="color:#6b7280;font-weight:600;">'+item.count+'</span></div>' +
              '<div style="background:#f1f5f9;border-radius:3px;height:6px;overflow:hidden;">' +
              '<div style="width:'+pct2+'%;height:100%;background:#1e3a5f;border-radius:3px;"></div></div></div>';
          }).join('');
        })()) +
    '</div></div>' +
    '</div>';

  html += '</div>'; // /two-col
  document.getElementById('profile-content').innerHTML = html;
}

// ── Term filter ─────────────────────────────────────────
function filterByTerm(idx) {
  activeTermIdx = idx;
  // Update tab styles
  var allTab = document.getElementById('tab-all');
  if (allTab) allTab.className = 'term-tab' + (idx === -1 ? ' active' : '');
  if (currentStudent && currentStudent.terms) {
    currentStudent.terms.forEach(function(_, i) {
      var t = document.getElementById('tab-' + i);
      if (t) t.className = 'term-tab' + (i === idx ? ' active' : '');
    });
  }

  var wrap = document.getElementById('ref-table-wrap');
  if (!wrap) {
    // Contacts panel is currently shown in its place — rebuild the
    // referral table container first.
    document.getElementById('left-panel-wrap').innerHTML = '<div id="ref-table-wrap"></div>';
    wrap = document.getElementById('ref-table-wrap');
  }
  if (wrap && currentStudent) {
    wrap.innerHTML = buildRefTable(currentStudent.referrals, idx, currentStudent.terms);
  }
}

function buildRefTable(referrals, termIdx, terms) {
  var filtered = referrals;
  if (termIdx >= 0 && terms && terms[termIdx]) {
    var term = terms[termIdx];
    filtered = referrals.filter(function(r) {
      var d = (r['IncidentDate'] || '').toString();
      return d >= term.start && d <= term.end;
    });
  }

  if (filtered.length === 0)
    return '<div class="empty-msg">No referrals for this period.</div>';

  var html = '<table><thead><tr>' +
    '<th>#</th><th>Date</th><th>Infraction</th>' +
    '<th>Pts Δ</th><th>Balance</th><th>Teacher</th><th></th>' +
    '</tr></thead><tbody>';
  filtered.forEach(function(r) {
    var pts    = parseInt(r['PointValue'], 10) || 0;
    var ptsStr = pts > 0 ? '+'+pts : pts.toString();
    var ptsCls = pts < 0 ? 'pts-neg' : 'pts-pos';

    // Store the full referral object keyed by ID so the View Details
    // modal can look it up without embedding (possibly quote-containing)
    // text directly inside an onclick attribute.
    _refDetailLookup[r['ID']] = r;

    html += '<tr>' +
      '<td style="color:#94a3b8;">'+esc(r['ID'])+'</td>' +
      '<td style="white-space:nowrap;">'+esc(formatDateMDY(r['IncidentDate']))+
        (r['IncidentTime'] ? '<div style="font-size:0.72rem;color:#9ca3af;">'+esc(formatTime12h(r['IncidentTime']))+'</div>' : '')+
      '</td>' +
      '<td>'+esc(r['InfractionType'])+'</td>' +
      '<td class="'+ptsCls+'">'+ptsStr+'</td>' +
      '<td>'+esc(r['PointsAfterReferral']||'')+'</td>' +
      '<td style="font-size:0.77rem;color:#64748b;">'+esc(r['TeacherName']||'')+'</td>' +
      '<td><button class="view-detail-btn" onclick="openRefDetailModal(\''+esc(r['ID'])+'\')">View</button></td>' +
      '</tr>';
  });
  return html + '</tbody></table>';
}

// ── SVG Timeline ──────────────────────────────────────────────
function buildTimelineSVG(timeline, sp, tiers) {
  var W = 280, H = 100, PAD = 14;
  var pts  = timeline.map(function(t){ return Math.max(0, t.points); });
  var n    = pts.length;
  var maxV = Math.max.apply(null, pts.concat([sp]));
  var range = Math.max(maxV, 1);
  var last  = pts[n - 1];
  var lastPct = sp > 0 ? Math.round(last / sp * 100) : 0;
  var ec    = getPointColor(lastPct, tiers);

  // The plotted line still uses the original PAD so the chart itself
  // keeps its proportions; only the text labels get extra breathing
  // room via TEXT_PAD so long date strings (MM-DD-YYYY) don't run past
  // the edges of the viewBox and get clipped by the card around it.
  function x(i) { return n === 1 ? W / 2 : PAD + (i / (n - 1)) * (W - PAD * 2); }
  function y(v) { return PAD + ((maxV - v) / range) * (H - PAD * 2); }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" ' +
            'style="width:100%;height:auto;overflow:visible;">';

  // Reference line at sp — label right-aligned and pulled in from the
  // edge so it never runs past the viewBox.
  svg += '<line x1="'+PAD+'" y1="'+y(sp)+'" x2="'+(W-PAD)+'" y2="'+y(sp)+'" ' +
         'stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>' +
         '<text x="'+(W-4)+'" y="'+(y(sp)-3)+'" font-size="8" fill="#94a3b8" text-anchor="end">'+sp+'</text>';

  if (n === 1) {
    // Single point — just show a labeled dot
    svg += '<circle cx="'+x(0)+'" cy="'+y(pts[0])+'" r="4" fill="'+ec+'"/>' +
           '<text x="'+x(0)+'" y="'+(H-2)+'" font-size="8" fill="#94a3b8" ' +
           'text-anchor="middle">'+esc(formatDateMDY(timeline[0].date))+'</text>';
  } else {
    var poly = pts.map(function(v, i){ return x(i) + ',' + y(v); }).join(' ');
    var area = 'M ' + x(0) + ',' + y(pts[0]) + ' ' +
               pts.map(function(v, i){ return 'L ' + x(i) + ',' + y(v); }).join(' ') +
               ' L ' + x(n-1) + ',' + y(0) + ' L ' + x(0) + ',' + y(0) + ' Z';

    svg += '<path d="'+area+'" fill="#1e3a5f" fill-opacity="0.07"/>' +
           '<polyline points="'+poly+'" fill="none" stroke="#1e3a5f" ' +
           'stroke-width="1.8" stroke-linejoin="round"/>' +
           '<circle cx="'+x(n-1)+'" cy="'+y(last)+'" r="3.5" fill="'+ec+'"/>' +
           // Start date label: anchored "start" and pinned to the left
           // edge, so it grows rightward into the chart instead of
           // spilling left past x=0.
           '<text x="2" y="'+(H-2)+'" font-size="8" fill="#94a3b8" ' +
           'text-anchor="start">'+esc(formatDateMDY(timeline[0].date))+'</text>' +
           // End date label: anchored "end" and pinned to the right
           // edge, so it grows leftward into the chart instead of
           // spilling right past x=W.
           '<text x="'+(W-2)+'" y="'+(H-2)+'" font-size="8" fill="#94a3b8" ' +
           'text-anchor="end">'+esc(formatDateMDY(timeline[n-1].date))+'</text>';
  }

  return svg + '</svg>';
}

// ── Utilities ─────────────────────────────────────────────────
function badge2(val, label, cls) {
  return '<div class="sum-b '+cls+'"><div class="sum-v">'+val+'</div><div class="sum-l">'+label+'</div></div>';
}

function getParam(name) {
  var search = window.location.search.slice(1).split('&');
  for (var i=0;i<search.length;i++) {
    var kv = search[i].split('=');
    if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1]||'');
  }
  return '';
}

var AVATAR_COLORS = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#14b8a6','#6366f1'];
function avatarColor(id) { return AVATAR_COLORS[id.charCodeAt(id.length-1) % AVATAR_COLORS.length]; }
function initials(name) {
  var words = name.trim().split(/\s+/);
  if (words.length >= 2) return (words[0][0] + words[words.length-1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Converts a "YYYY-MM-DD" string to "MM-DD-YYYY" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
function formatDateMDY(d) {
  if (!d) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if (!m) return d;
  return m[2] + '-' + m[3] + '-' + m[1];
}

// Converts a "HH:MM" (24-hr) string to "H:MM AM/PM" for display.
// Returns the input unchanged if it doesn't match the expected pattern.
function formatTime12h(t) {
  if (!t) return '';
  var m = /^(\d{1,2}):(\d{2})/.exec(t);
  if (!m) return t;
  var h = parseInt(m[1], 10);
  var min = m[2];
  var period = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + min + ' ' + period;
}

// Mirrors POINT_COLOR_PALETTE in Code.gs — the constrained set of colors
// admins can choose from in Settings. Used only as a fallback below;
// the student object from the server already carries a resolved
// pointColor hex value, so this path should rarely run.
var POINT_COLOR_PALETTE = {
  green: '#10b981', blue: '#3b82f6', purple: '#8b5cf6',
  amber: '#eab308', orange: '#f97316', red: '#ef4444'
};

// Resolves a percentage (0-100) to a hex color using the admin-configured
// point tiers (key/threshold pairs, as returned by getStudentProfile()
// and getAllStudents()). Mirrors getPointColor() in Code.gs. tiers must
// be sorted descending by threshold, which parsePointTiers() guarantees.
function getPointColor(pct, tiers) {
  var list = (tiers && tiers.length) ? tiers : [
    { threshold: 70, color: 'green' },
    { threshold: 40, color: 'amber' },
    { threshold: 0,  color: 'red'   }
  ];
  for (var i = 0; i < list.length; i++) {
    if (pct >= list[i].threshold) {
      return POINT_COLOR_PALETTE[list[i].color] || '#94a3b8';
    }
  }
  return '#94a3b8';
}

// Converts a hex color to a light background tint (mixed toward white)
// for use behind a solid-colored point display. Works for any of the
// 6 palette colors without needing a separate server-side tint table.
function hexToLightTint(hex) {
  var h = (hex || '').replace('#', '');
  if (h.length !== 6) return '#f1f5f9';
  var r = parseInt(h.substr(0, 2), 16);
  var g = parseInt(h.substr(2, 2), 16);
  var b = parseInt(h.substr(4, 2), 16);
  var mix = function(c) { return Math.round(c + (255 - c) * 0.85); };
  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
}

function renderStudentInfoForm() {
  var s = currentStudent.student;
  var html =
    '<div style="padding:16px;">' +
      '<div class="ce-grid">' +
        '<div>' +
          '<label>First Name</label>' +
          '<input type="text" id="info-firstName" value="'+esc(s.firstName||'')+'">' +
        '</div>' +
        '<div>' +
          '<label>Last Name</label>' +
          '<input type="text" id="info-lastName" value="'+esc(s.lastName||'')+'">' +
        '</div>' +
        '<div>' +
          '<label>Middle Name <span style="font-weight:400;color:#9ca3af;">(optional)</span></label>' +
          '<input type="text" id="info-middleName" value="'+esc(s.middleName||'')+'">' +
        '</div>' +
        '<div>' +
          '<label>Grade</label>' +
          '<input type="text" id="info-grade" value="'+esc(s.grade||'')+'">' +
        '</div>' +
      '</div>' +
      '<div style="font-size:0.78rem;color:#94a3b8;margin-bottom:10px;">' +
        'Student ID: '+esc(s.studentId)+' (cannot be changed) · Points are managed through ' +
        'referrals and positive notes, not edited directly here.' +
      '</div>' +
      '<div class="ce-btn-row" style="justify-content:flex-start;">' +
        '<button class="ce-btn primary" onclick="saveStudentInfoEdit()">Save Changes</button>' +
      '</div>' +
      '<div class="ce-msg" id="info-msg"></div>' +
    '</div>';

  document.getElementById('edit-info-content').innerHTML = html;
}

function saveStudentInfoEdit() {
  var msgEl = document.getElementById('info-msg');
  var update = {
    studentId:  currentStudent.student.studentId,
    firstName:  document.getElementById('info-firstName').value.trim(),
    lastName:   document.getElementById('info-lastName').value.trim(),
    middleName: document.getElementById('info-middleName').value.trim(),
    grade:      document.getElementById('info-grade').value.trim()
  };

  if (!update.firstName || !update.lastName || !update.grade) {
    msgEl.textContent = 'First name, last name, and grade are required.';
    msgEl.className = 'ce-msg err';
    return;
  }

  msgEl.textContent = 'Saving...';
  msgEl.className = 'ce-msg';

  google.script.run
    .withSuccessHandler(function(r) {
      if (!r.success) {
        msgEl.textContent = 'Error: ' + (r.error || 'Unknown');
        msgEl.className = 'ce-msg err';
        return;
      }
      // Update the cached student data and the header display in place —
      // no full profile reload needed.
      var s = currentStudent.student;
      s.firstName  = update.firstName;
      s.lastName   = update.lastName;
      s.middleName = update.middleName;
      s.grade      = update.grade;
      s.studentName = (update.firstName + ' ' + update.lastName).trim().replace(/\s+/g, ' ');

      document.querySelector('.p-name').textContent = s.studentName;
      document.querySelector('.p-meta').textContent =
        'Grade ' + s.grade + ' · ID: ' + s.studentId;
      var avatarEl = document.querySelector('.p-avatar');
      if (avatarEl) avatarEl.textContent = initials(s.studentName);

      msgEl.textContent = '✓ Saved.';
      msgEl.className = 'ce-msg ok';
    })
    .withFailureHandler(function(err) {
      msgEl.textContent = 'Error: ' + (err.message || err);
      msgEl.className = 'ce-msg err';
    })
    .saveStudent(update);
}

function loadContactsList() {
  if (!currentStudent || !currentStudent.student) return;
  var studentId = currentStudent.student.studentId;

  google.script.run
    .withSuccessHandler(function(r) {
      if (!r.success) {
        document.getElementById('contacts-panel').innerHTML =
          '<div style="color:#dc2626;padding:16px;">'+esc(r.error)+'</div>';
        return;
      }
      _contactsForStudent = r.contacts || [];
      _contactTypes = r.types && r.types.length > 0 ? r.types : _contactTypes;
      renderContactsList();
    })
    .withFailureHandler(function(err) {
      document.getElementById('contacts-panel').innerHTML =
        '<div style="color:#dc2626;padding:16px;">Error: '+esc(err.message||err)+'</div>';
    })
    .getStudentContacts(studentId);
}

function renderContactsList() {
  var panel = document.getElementById('contacts-panel');
  var html =
    '<div style="padding:14px 16px 4px;">' +
      '<div class="contacts-disclaimer">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">' +
          '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' +
        '</svg>' +
        '<span><b>This list controls who receives the end-of-day referral email</b> for ' +
        'this student. It is <b>not synced from Infinite Campus</b> or any other system — ' +
        'an admin must manually add or remove referral contacts here if the list of ' +
        'recipients changes.</span>' +
      '</div>';

  if (_contactsForStudent.length === 0) {
    html += '<div class="contacts-empty">No contacts on file for this student.</div>';
  } else {
    html += _contactsForStudent.map(function(c) {
      return '<div class="contact-card">' +
        '<span class="contact-type-badge">'+esc(c.type || 'Unspecified')+'</span>' +
        '<div class="contact-card-info">' +
          '<div class="contact-card-name">'+esc(c.name)+'</div>' +
          '<div class="contact-card-email">'+esc(c.email)+'</div>' +
        '</div>' +
        '<div class="contact-card-actions">' +
          '<button onclick="openContactEditor('+c.rowIndex+')">Edit</button>' +
          '<button class="danger" onclick="confirmDeleteContact('+c.rowIndex+',\''+esc(c.name)+'\')">Remove</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  html += '<button class="add-contact-btn" onclick="openContactEditor(null)">+ Add Contact</button>';
  html += '<div class="contact-edit-form" id="ce-form">' + buildContactFormHtml() + '</div>';
  html += '</div>';

  panel.innerHTML = html;
}

// Builds the (initially hidden) add/edit form shell — fields get
// populated by openContactEditor.
function buildContactFormHtml() {
  return (
    '<div class="ce-search" id="ce-search-wrap" style="display:none;">' +
      '<label style="font-size:0.76rem;font-weight:600;color:#374151;margin-bottom:4px;display:block;">' +
        'Search existing contacts' +
        '<span style="font-weight:400;color:#94a3b8;margin-left:6px;">— or fill in new below</span>' +
      '</label>' +
      '<input type="text" id="ce-search-input" placeholder="Type a name or email..."' +
             ' oninput="onContactSearch(this.value)">' +
      '<div class="ce-search-results" id="ce-search-results"></div>' +
    '</div>' +
    '<div class="ce-grid">' +
      '<div class="full" style="grid-column:1/-1;"><label>Type</label>' +
        '<select id="ce-type">' +
          '<option value="">— Select —</option>' +
          _contactTypes.map(function(r) { return '<option value="'+esc(r)+'">'+esc(r)+'</option>'; }).join('') +
        '</select>' +
      '</div>' +
      '<div><label>First Name</label><input type="text" id="ce-first" placeholder="First"></div>' +
      '<div><label>Last Name</label><input type="text" id="ce-last"  placeholder="Last"></div>' +
      '<div style="grid-column:1/-1;"><label>Email</label><input type="email" id="ce-email" placeholder="name@email.com"></div>' +
    '</div>' +
    '<div class="ce-siblings" id="ce-siblings" style="display:none;">' +
      '<div class="ce-siblings-title">Also update for siblings? (unchecked by default)</div>' +
      '<div id="ce-siblings-list"></div>' +
    '</div>' +
    '<div class="ce-btn-row">' +
      '<span class="ce-msg" id="ce-msg"></span>' +
      '<button class="ce-btn secondary" onclick="closeContactEditor()">Cancel</button>' +
      '<button class="ce-btn primary" onclick="submitContactForm()">Save</button>' +
    '</div>'
  );
}

// Fallback default, used only until the real list arrives from the
// server (getStudentContacts()'s "types" field, sourced from the
// admin-editable Contact Types list on Settings > General) — avoids a
// blank dropdown for the brief moment before that first response lands.
var _contactTypes = ['Parent/Guardian', 'Administrator', 'Counselor', 'Case Manager'];

// rowIndex === null → adding a brand new contact.
// rowIndex !== null → editing the contact at that sheet row.
function openContactEditor(rowIndex) {
  _ceRowIndex = rowIndex;
  _ceGuid     = '';
  _ceSiblings = [];

  var form = document.getElementById('ce-form');
  form.classList.add('open');
  setCeMsg('', '');

  clearVal('ce-first'); clearVal('ce-last'); clearVal('ce-email');
  document.getElementById('ce-type').value = '';

  if (rowIndex === null) {
    // New contact — show search-before-create, no siblings yet.
    document.getElementById('ce-search-wrap').style.display = 'block';
    document.getElementById('ce-search-input').value = '';
    document.getElementById('ce-siblings').style.display = 'none';
  } else {
    // Editing an existing contact — find it in the cached list.
    document.getElementById('ce-search-wrap').style.display = 'none';
    var existing = _contactsForStudent.find(function(c) { return c.rowIndex === rowIndex; });
    if (existing) {
      _ceGuid = existing.guid || '';
      setVal('ce-first', existing.firstName || '');
      setVal('ce-last',  existing.lastName  || '');
      setVal('ce-email', existing.email     || '');
      document.getElementById('ce-type').value = existing.type || '';
    }

    // Look up siblings sharing this contact's GUID (same person linked
    // to other students) so the admin can optionally push the same
    // update to them too.
    if (_ceGuid) {
      google.script.run
        .withSuccessHandler(function(siblings) {
          _ceSiblings = siblings || [];
          renderSiblingCheckboxes();
        })
        .withFailureHandler(function() { _ceSiblings = []; renderSiblingCheckboxes(); })
        .findContactSiblings(_ceGuid, currentStudent.student.studentId);
    } else {
      document.getElementById('ce-siblings').style.display = 'none';
    }
  }

  form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderSiblingCheckboxes() {
  if (_ceSiblings.length === 0) {
    document.getElementById('ce-siblings').style.display = 'none';
    return;
  }
  var list = document.getElementById('ce-siblings-list');
  list.innerHTML = _ceSiblings.map(function(sib) {
    return '<div class="ce-sibling-item">' +
      '<input type="checkbox" id="sib-'+esc(sib.studentId)+'" value="'+esc(sib.studentId)+'">' +
      '<label for="sib-'+esc(sib.studentId)+'" style="margin:0;font-weight:400;font-size:0.84rem;">' +
        esc(sib.studentName) +
      '</label>' +
    '</div>';
  }).join('');
  document.getElementById('ce-siblings').style.display = 'block';
}

function closeContactEditor() {
  var form = document.getElementById('ce-form');
  if (form) form.classList.remove('open');
  var results = document.getElementById('ce-search-results');
  if (results) results.style.display = 'none';
}

// Search existing contacts as the admin types (search-before-create —
// prevents accidentally creating a duplicate GUID for someone already
// on file for another student).
function onContactSearch(query) {
  clearTimeout(_ceSearchTimer);
  var results = document.getElementById('ce-search-results');
  if (!query || query.length < 2) {
    results.style.display = 'none';
    return;
  }
  _ceSearchTimer = setTimeout(function() {
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r.success || r.results.length === 0) {
          results.style.display = 'none';
          return;
        }
        results.innerHTML = r.results.map(function(p) {
          return '<div class="ce-search-item" onclick="selectExistingContact('+
            JSON.stringify(p).replace(/"/g,'&quot;')+')">' +
            '<div class="ce-si-name">'+esc(p.name)+' <span style="color:#94a3b8;font-weight:400;">('+esc(p.type||'—')+')</span></div>' +
            '<div class="ce-si-email">'+esc(p.email)+'</div>' +
          '</div>';
        }).join('');
        results.style.display = 'block';
      })
      .withFailureHandler(function() { results.style.display = 'none'; })
      .searchParentContacts(query);
  }, 300);
}

// Admin selected an existing contact from search results — reuse their
// GUID so this new row is recognized as the same person.
function selectExistingContact(p) {
  _ceGuid = p.guid;
  setVal('ce-first', p.firstName || '');
  setVal('ce-last',  p.lastName  || '');
  setVal('ce-email', p.email || '');
  if (p.type) document.getElementById('ce-type').value = p.type;
  document.getElementById('ce-search-results').style.display = 'none';
  document.getElementById('ce-search-input').value = p.name || '';
}

function submitContactForm() {
  var type  = document.getElementById('ce-type').value;
  var first = document.getElementById('ce-first').value.trim();
  var last  = document.getElementById('ce-last').value.trim();
  var email = document.getElementById('ce-email').value.trim();

  if (!type)  { setCeMsg('Select a type.', 'err'); return; }
  if (!first || !last || !email) {
    setCeMsg('First name, last name, and email are required.', 'err');
    return;
  }

  // Collect selected sibling IDs (opt-in — only checked ones)
  var siblingIds = [];
  _ceSiblings.forEach(function(sib) {
    var chk = document.getElementById('sib-' + sib.studentId);
    if (chk && chk.checked) siblingIds.push(sib.studentId);
  });

  var contact = {
    guid:      _ceGuid,
    type:      type,
    firstName: first,
    lastName:  last,
    email:     email
  };
  if (_ceRowIndex !== null) contact.rowIndex = _ceRowIndex;

  setCeMsg('Saving...', 'ld');
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        setCeMsg('✓ Saved' + (r.updatedSiblings > 0 ? ' (' + r.updatedSiblings + ' sibling record(s) updated)' : '') + '.', 'ok');
        setTimeout(function() {
          closeContactEditor();
          loadContactsList();
        }, 800);
      } else {
        setCeMsg('Error: ' + (r.error || 'Unknown'), 'err');
      }
    })
    .withFailureHandler(function(err) {
      setCeMsg('Error: ' + (err.message || err), 'err');
    })
    .saveContact(currentStudent.student.studentId, contact, siblingIds);
}

function confirmDeleteContact(rowIndex, name) {
  if (!confirm('Remove ' + name + ' from this student\'s referral email contacts?\n\nThis only removes this one contact — other contacts for this student are unaffected.')) return;
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) loadContactsList();
      else alert('Error: ' + (r.error || 'Unknown'));
    })
    .withFailureHandler(function(err) { alert('Error: ' + (err.message || err)); })
    .deleteContact(rowIndex);
}

function setCeMsg(text, type) {
  var el = document.getElementById('ce-msg');
  if (!el) return;
  el.textContent = text;
  el.className = 'ce-msg' + (type ? ' ' + type : '');
}

function setVal(id, val) {
  var el = document.getElementById(id);
  if (el) el.value = val;
}

function clearVal(id) {
  var el = document.getElementById(id);
  if (el) el.value = '';
}
</script>
</body>
</html>
